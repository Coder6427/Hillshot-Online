<body>
<canvas id="game"></canvas>
<div class="hud"><div class="teams" id="teams"></div><div class="panel turn"><div id="turnText" class="big">Hillshot</div><div class="small" id="windText">Wind 0</div><div class="bar"><div class="fill" id="powerFill"></div></div><div class="small" id="energyText">Energy 100</div><div class="bar"><div class="fill energyFill" id="energyFill"></div></div></div></div>
<div class="panel msg" id="message"></div><div class="weapons" id="weapons"></div><button class="resign" id="resignBtn" title="Resign">Resign</button><div class="killFeed" id="killFeed"></div><div class="chatDock" id="chatDock"><button class="chatToggle" id="chatToggle" title="Chat" aria-label="Chat"></button><div class="chatPanel"><div class="chatTop"><span>Chat</span><button class="chatClose" id="chatClose" title="Close Chat" aria-label="Close Chat">X</button></div><div class="chatLog" id="chatLog"></div><div class="chatRow"><input id="chatInput" maxlength="90" placeholder="Type Message"><button id="chatSend">Send</button></div></div></div><div class="joy" id="joystick"></div>
<div class="menu" id="menu"><div class="lobby"><div class="tiles"></div><div class="top"><div><div class="logo">Hillshot</div><div class="small" id="regionText">Thailand-ready party links</div></div></div><div class="leftCard"><div class="small">Player</div><div class="big" id="playerName">Guest</div><div class="status" id="readyText">Not Ready</div><button class="choice" id="settingsBtn">Settings</button></div><div class="avatar"><div class="menuStar"></div><div class="base"></div></div><div class="hintLine">Move: A/D or Arrow Keys &nbsp; Jump: Up &nbsp; Tools: Q/W/E &nbsp; Fire: Space</div><div class="side">
  <div class="step show" id="stepStart"><button class="choice primary playbig" id="soloBtn">PLAY<small>Guest Solo vs AI</small></button><button class="choice green" id="accountBtn">Make Account<small>Play Online With Friends</small></button><button class="choice blue" id="guestBtn">Play As Guest<small>Choose Party Or Solo</small></button></div>
  <div class="step" id="stepAccount"><div class="panel"><div class="big">Account Name</div><input id="nameInput" maxlength="18" placeholder="Type Here"><button class="choice green" id="finishName">Finish</button></div></div>
  <div class="step" id="stepParty"><button class="choice primary" id="guestSoloBtn">PLAY SOLO<small>Start Instantly As Guest</small></button><button class="choice green" id="makeParty">Make Party<small>Get A Code For Your Friend</small></button><button class="choice blue" id="joinParty">Join Party<small>Type Your Friend's Code</small></button><input id="joinCode" placeholder="Party Code"></div>
  <div class="step" id="stepMode"><div class="panel"><div class="small">Party Code</div><div class="big" id="partyCode">None</div><input id="inviteLink" readonly></div><button class="choice green" id="teamMode">Play As A Team<small>You And Your Friend vs AI</small></button><button class="choice primary" id="versusMode">Fight Each Other<small>Player vs Player</small></button><button class="choice primary playbig" id="playBtn">PLAY<small id="playHint">Start Team Match</small></button></div>
